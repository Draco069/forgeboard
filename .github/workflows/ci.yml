name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# CI only needs to read the repository. Packaging is intentionally not run
# here: it needs platform-specific toolchains and, for a real release, signing
# identities that a pull request should never have access to.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # 22.22.2 is the minimum supported version in package.json "engines".
      - name: Use Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
